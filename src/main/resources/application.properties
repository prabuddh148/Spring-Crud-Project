# Default configuration
spring.application.name=spring-crud-project

# Active profile: 'dev' (H2 in-memory) or 'prod' (MySQL)
spring.profiles.active=dev

# Common prefix for every endpoint, so controllers keep plain
# module paths like /auth and /users.
server.servlet.context-path=/api

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Run data.sql after Hibernate has created the tables, so the
# roles seed does not fail on a fresh database.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Logging
logging.level.root=INFO
logging.level.com.example=DEBUG
