# Dev Profile
spring.datasource.url=jdbc:mysql://localhost:3306/taskdb?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

logging.level.root=WARN
logging.level.com.example=INFO

jwt.secret=my-super-secret-key-for-jwt-12345678901234567890
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
